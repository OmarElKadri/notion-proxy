[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "notion-proxy"
version = "0.1.0"
description = "Local proxy exposing Notion AI as an Anthropic Messages API endpoint."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "curl-cffi>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
notion-proxy = "notion_proxy.__main__:main"

[tool.setuptools]
packages = ["notion_proxy", "notion_proxy.tools", "notion_proxy.notion"]
py-modules = ["extract_claude_context", "generate_notion_config"]

[tool.pytest.ini_options]
testpaths = ["tests"]
